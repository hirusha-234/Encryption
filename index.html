<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AES Decrypter - Secure Access</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0e27;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 20px;
      text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
      overflow-x: hidden;
    }

    .scan-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(0, 255, 65, 0.3);
      animation: scan 8s linear infinite;
      pointer-events: none;
      z-index: 1000;
    }

    @keyframes scan {
      0% { top: 0; }
      100% { top: 100vh; }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      border: 2px solid #00ff41;
      padding: 30px;
      background: rgba(0, 20, 40, 0.9);
      backdrop-filter: blur(10px);
      box-shadow: 
        0 0 20px rgba(0, 255, 65, 0.3),
        inset 0 0 20px rgba(0, 255, 65, 0.1);
      margin-bottom: 20px;
      animation: flicker 0.15s infinite;
      text-align: center;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
      animation: glow 2s ease-in-out infinite;
    }

    .subtitle {
      font-size: 12px;
      color: #00cc33;
      letter-spacing: 2px;
    }

    .content-box {
      border: 2px solid #00ff41;
      padding: 20px;
      background: rgba(0, 20, 40, 0.8);
      backdrop-filter: blur(10px);
      box-shadow: 
        0 0 20px rgba(0, 255, 65, 0.3),
        inset 0 0 20px rgba(0, 255, 65, 0.1);
      margin-bottom: 20px;
      animation: flicker 0.15s infinite;
    }

    .key-display {
      background: rgba(0, 255, 65, 0.05);
      border: 1px dashed #00ff41;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 11px;
      line-height: 1.6;
    }

    .key-label {
      color: #00cc33;
      margin-bottom: 5px;
    }

    .key-value {
      color: #00ff41;
      word-break: break-all;
      font-weight: bold;
    }

    label {
      display: block;
      color: #00ff41;
      margin-bottom: 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    textarea {
      width: 100%;
      height: 150px;
      background: rgba(0, 20, 40, 0.6);
      color: #00ff41;
      border: 1px solid #00ff41;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      resize: vertical;
      outline: none;
      transition: all 0.3s;
    }

    textarea:focus {
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.5), inset 0 0 10px rgba(0, 255, 65, 0.1);
      border-color: #00ff41;
    }

    textarea::placeholder {
      color: #00884422;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      background: linear-gradient(135deg, #00ff41, #00cc33);
      color: #0a0e27;
      border: 2px solid #00ff41;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
    }

    button:hover {
      background: linear-gradient(135deg, #00ff41, #00ff41);
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.8);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .button-copy {
      flex: 0.5;
      background: linear-gradient(135deg, #0066ff, #0044cc);
      border-color: #0066ff;
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 102, 255, 0.3);
    }

    .button-copy:hover {
      box-shadow: 0 0 20px rgba(0, 102, 255, 0.8);
    }

    .output-box {
      border: 2px solid #00ff41;
      padding: 20px;
      background: rgba(0, 20, 40, 0.8);
      backdrop-filter: blur(10px);
      box-shadow: 
        0 0 20px rgba(0, 255, 65, 0.3),
        inset 0 0 20px rgba(0, 255, 65, 0.1);
      animation: flicker 0.15s infinite;
      display: none;
    }

    .output-box.active {
      display: block;
    }

    .output-content {
      background: rgba(0, 10, 20, 0.8);
      border: 1px solid #00ff41;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      color: #00ff41;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .error {
      border-color: #ff4400;
      color: #ff8800;
      text-shadow: 0 0 10px rgba(255, 136, 0, 0.5);
      display: none;
    }

    .error.active {
      display: block;
      margin-bottom: 20px;
    }

    .status {
      font-size: 11px;
      color: #00cc33;
      margin-top: 10px;
      text-align: center;
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 49%, 100% { opacity: 1; }
      50%, 99% { opacity: 0; }
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px rgba(0, 255, 65, 0.5); }
      50% { text-shadow: 0 0 20px rgba(0, 255, 65, 0.8), 0 0 30px rgba(0, 255, 65, 0.4); }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.98; }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 20, 40, 0.5);
    }

    ::-webkit-scrollbar-thumb {
      background: #00ff41;
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
    }
  </style>
</head>
<body>
  <div class="scan-line"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="title">⚠ AES DECRYPTION TERMINAL ⚠</div>
      <div class="subtitle">>>> SECURE DECODING PROTOCOL <<<</div>
    </div>

    <!-- Key Display -->
    <div class="content-box">
      <div class="key-display">
        <div class="key-label">$ Key (Hex):</div>
        <div class="key-value">00112233445566778899AABBCCDDEEFF</div>
      </div>
      <div class="key-display">
        <div class="key-label">$ IV (Hex):</div>
        <div class="key-value">0102030405060708090A0B0C0D0E0F10</div>
      </div>
    </div>

    <!-- Input Section -->
    <div class="content-box">
      <label for="encrypted">$ Enter Encrypted Data (Hex Format)</label>
      <textarea id="encrypted" placeholder="Paste encrypted hex data here (e.g., A1B2C3D4E5F6...)"></textarea>
      <div class="button-group">
        <button onclick="decrypt()">► Decrypt</button>
        <button onclick="clearAll()" style="background: linear-gradient(135deg, #ff6600, #ff4400); border-color: #ff6600; color: #fff; box-shadow: 0 0 10px rgba(255, 102, 0, 0.3);">⌫ Clear</button>
      </div>
      <div class="status">$ <span class="blink">█</span> Ready for input</div>
    </div>

    <!-- Error Display -->
    <div id="errorBox" class="error content-box">
      <div id="errorMsg"></div>
    </div>

    <!-- Output Section -->
    <div id="outputBox" class="output-box">
      <label>$ Decrypted Output</label>
      <div class="output-content" id="output"></div>
      <div class="button-group" style="margin-top: 15px;">
        <button class="button-copy" onclick="copyOutput()">📋 Copy</button>
      </div>
      <div class="status">$ <span class="blink">█</span> Decryption successful</div>
    </div>
  </div>

  <script>
    const KEY = '00112233445566778899AABBCCDDEEFF';
    const IV = '0102030405060708090A0B0C0D0E0F10';

    function hexToBytes(hex) {
      const bytes = [];
      for (let i = 0; i < hex.length; i += 2) {
        bytes.push(parseInt(hex.substr(i, 2), 16));
      }
      return new Uint8Array(bytes);
    }

    async function decrypt() {
      const encryptedInput = document.getElementById('encrypted').value;
      const errorBox = document.getElementById('errorBox');
      const outputBox = document.getElementById('outputBox');
      const errorMsg = document.getElementById('errorMsg');
      const output = document.getElementById('output');

      errorBox.classList.remove('active');
      outputBox.classList.remove('active');

      try {
        if (!encryptedInput.trim()) {
          throw new Error('Please enter encrypted data');
        }

        const hexString = encryptedInput.replace(/\s/g, '').toUpperCase();
        if (hexString.length % 2 !== 0) {
          throw new Error('Invalid hex string - must have even number of characters');
        }

        const encryptedArray = hexToBytes(hexString);
        const keyArray = hexToBytes(KEY);
        const ivArray = hexToBytes(IV);

        if (encryptedArray.length % 16 !== 0) {
          throw new Error('Encrypted data length must be multiple of 16');
        }

        const key = await window.crypto.subtle.importKey(
          'raw',
          keyArray,
          { name: 'AES-CBC' },
          false,
          ['decrypt']
        );

        const decrypted = await window.crypto.subtle.decrypt(
          { name: 'AES-CBC', iv: ivArray },
          key,
          encryptedArray
        );

        const decoder = new TextDecoder();
        const result = decoder.decode(decrypted);
        
        output.textContent = result;
        outputBox.classList.add('active');
      } catch (err) {
        errorMsg.textContent = '⚠ ERROR: ' + err.message;
        errorBox.classList.add('active');
      }
    }

    function copyOutput() {
      const output = document.getElementById('output').textContent;
      navigator.clipboard.writeText(output).then(() => {
        alert('Copied to clipboard!');
      });
    }

    function clearAll() {
      document.getElementById('encrypted').value = '';
      document.getElementById('outputBox').classList.remove('active');
      document.getElementById('errorBox').classList.remove('active');
    }

    document.getElementById('encrypted').addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') {
        decrypt();
      }
    });
  </script>
</body>
</html>
